name: TMS2 clean-room Lean

on:
  pull_request:
    paths:
      - "formalizations/tms2-cleanroom/**"
      - ".github/workflows/tms2-cleanroom.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install elan and pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat formalizations/tms2-cleanroom/lean-toolchain)"
      - name: Record toolchain
        working-directory: formalizations/tms2-cleanroom
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version
      - name: Build and retain diagnostics
        id: build
        working-directory: formalizations/tms2-cleanroom
        shell: bash
        run: |
          set +e
          lake update > build.log 2>&1
          update_status=$?
          if [ "$update_status" -eq 0 ]; then
            lake build >> build.log 2>&1
            build_status=$?
          else
            build_status=1
          fi
          status=$(( update_status != 0 || build_status != 0 ))
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 300 build.log
          exit 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tms2-cleanroom-build-log
          path: formalizations/tms2-cleanroom/build.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail on build error
        if: steps.build.outputs.status != '0'
        run: exit 1
